# Dev environment Helm overlay
# HPA and PDB disabled for faster iteration

global:
  env: development
  replicaCount: 1

# HPA and PDB are disabled in dev for iteration speed
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

pdb:
  enabled: false
  minAvailable: 1

terminationGracePeriodSeconds: 10

# Staging environment Helm overlay

global:
  env: staging
  replicaCount: 2

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

terminationGracePeriodSeconds: 30

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  periodSeconds: 10
  failureThreshold: 3
  initialDelaySeconds: 15

readinessProbe:
  httpGet:
    path: /health/ready
    port: 3000
  periodSeconds: 30
  failureThreshold: 2
  initialDelaySeconds: 10

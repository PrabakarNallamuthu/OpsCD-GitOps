# Production environment Helm overlay
# All 8 services run 3 replicas with HPA (max 10) and PDB (minAvailable 2)

global:
  env: production
  image:
    tag: "" # Set by CI pipeline (git SHA)
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

# Graceful shutdown — 30s allows Kafka offset commits + connection drain
terminationGracePeriodSeconds: 30

# Tuned probe configuration for production
startupProbe:
  httpGet:
    path: /health
    port: 3000
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  periodSeconds: 10
  failureThreshold: 3
  initialDelaySeconds: 15

readinessProbe:
  httpGet:
    path: /health/ready
    port: 3000
  periodSeconds: 30
  failureThreshold: 2
  initialDelaySeconds: 10

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

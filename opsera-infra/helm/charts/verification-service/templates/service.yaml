apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-verification-service
  labels:
    app.kubernetes.io/name: verification-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: verification-service
    app.kubernetes.io/instance: {{ .Release.Name }}

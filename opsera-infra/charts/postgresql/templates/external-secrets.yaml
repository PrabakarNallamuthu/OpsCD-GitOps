---
# Dynamic credentials from Vault for each service
{{- range list "release" "risk" "policy" "audit" "verification" "analytics" "auth" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-creds-{{ . }}
  namespace: opsera-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: postgresql-creds-{{ . }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: database/creds/svc_{{ . }}
        property: connection_string
    - secretKey: DB_USER
      remoteRef:
        key: database/creds/svc_{{ . }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: database/creds/svc_{{ . }}
        property: password
---
{{- end }}

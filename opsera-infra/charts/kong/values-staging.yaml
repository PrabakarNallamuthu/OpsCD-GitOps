# ── Kong API Gateway — Staging environment ───────────────────────────────────
kong:
  namespace: opsera-dmz
  env:
    database: "off"
    plugins: "bundled,correlation-id,jwt,rate-limiting,request-transformer,response-transformer"
    ssl_protocols: "TLSv1.3"
    log_level: "info"
    proxy_access_log: "/dev/stdout"
    proxy_error_log: "/dev/stderr"
    admin_access_log: "/dev/stdout"
    admin_error_log: "/dev/stderr"
    client_body_buffer_size: "8m"
    proxy_buffer_size: "8k"

  ingressController:
    enabled: true
    ingressClass: kong
    installCRDs: false

  proxy:
    enabled: true
    type: LoadBalancer
    tls:
      enabled: true
      servicePort: 443
      containerPort: 8443
    http:
      enabled: true
      servicePort: 80
      containerPort: 8000

  admin:
    enabled: true
    type: ClusterIP

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  replicaCount: 2
  podAnnotations:
    linkerd.io/inject: enabled

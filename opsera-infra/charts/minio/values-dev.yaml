# ── MinIO — Dev environment ───────────────────────────────────────────────────
#
# Dev: single-node (non-distributed) for simplicity.
# Prod: distributed mode with 4 nodes and erasure coding.

minio:
  # Deploy in data zone
  namespace: opsera-data

  # Dev: minimal sizing
  mode: standalone
  replicas: 1

  # Bootstrap credentials — rotated to Vault-managed after WO-005
  # NEVER commit real credentials; this is a placeholder
  rootUser: "opsera-minio-admin"
  rootPassword: ""  # Set via --set or external secret during deploy

  # Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  # Persistent storage
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""  # Default StorageClass (should be encrypted)

  # Server-side encryption: SSE-S3 (MinIO-managed keys for dev)
  # For prod: SSE-KMS with Vault Transit engine
  environment:
    MINIO_BROWSER_REDIRECT_URL: ""
    # SSE-S3 enables automatic encryption of all objects
    MINIO_KMS_SECRET_KEY: ""  # Populated from Vault ESO in prod

  # Services
  service:
    type: ClusterIP
    port: 9000
    nodePort: null

  consoleService:
    type: ClusterIP
    port: 9001

  # Prometheus metrics
  metrics:
    serviceMonitor:
      enabled: false  # Enable after monitoring stack is deployed
      additionalLabels:
        release: prometheus

  # Ingress — disabled (internal only)
  ingress:
    enabled: false

  consoleIngress:
    enabled: false

  # Liveness/readiness
  livenessProbe:
    httpGet:
      path: /minio/health/live
      port: 9000
    initialDelaySeconds: 60
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /minio/health/ready
      port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10

apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-rdb-snapshot
  namespace: opsera-data
  labels:
    app.kubernetes.io/name: redis-snapshot
    app.kubernetes.io/component: backup
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: redis-snapshot
              image: bitnami/redis:7.2
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  SNAPSHOT_DATE=$(date +%Y%m%d_%H%M%S)
                  BUCKET="${MINIO_BUCKET:-opsera-redis-snapshots}"

                  redis-cli \
                    -h "${REDIS_SENTINEL_HOST:-redis-sentinel.opsera-data.svc.cluster.local}" \
                    -p "${REDIS_SENTINEL_PORT:-26379}" \
                    SENTINEL get-master-addr-by-name mymaster | \
                  read -r MASTER_HOST MASTER_PORT

                  redis-cli \
                    -h "${MASTER_HOST}" \
                    -p "${MASTER_PORT}" \
                    --no-auth-warning \
                    -a "${REDIS_PASSWORD}" \
                    BGSAVE

                  sleep 10

                  redis-cli \
                    -h "${MASTER_HOST}" \
                    -p "${MASTER_PORT}" \
                    --no-auth-warning \
                    -a "${REDIS_PASSWORD}" \
                    CONFIG GET dir | tail -1 | \
                  read -r RDB_DIR

                  mc cp "${RDB_DIR}/dump.rdb" \
                    "minio/${BUCKET}/$(hostname)/${SNAPSHOT_DATE}/dump.rdb"

                  echo "RDB snapshot completed: ${SNAPSHOT_DATE}"
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-credentials
                      key: redis-password
                - name: MINIO_ENDPOINT
                  value: "http://minio.opsera-data.svc.cluster.local:9000"
                - name: MINIO_BUCKET
                  value: opsera-redis-snapshots

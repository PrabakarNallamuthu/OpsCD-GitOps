---
# External Secrets Operator — SecretStore (Vault backend)
# Authenticates to Vault using Kubernetes ServiceAccount tokens.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.opsera-internal.svc.cluster.local:8200"
      path: "opsera"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ExternalSecret template: JWT signing keys (auth-service)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-signing-keys
  namespace: opsera-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jwt-signing-keys
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: private_key
      remoteRef:
        key: jwt-signing-keys/rs256
        property: private_key
    - secretKey: public_key
      remoteRef:
        key: jwt-signing-keys/rs256
        property: public_key
    - secretKey: key_id
      remoteRef:
        key: jwt-signing-keys/rs256
        property: key_id

---
# ExternalSecret: Kafka SASL credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-sasl-credentials
  namespace: opsera-internal
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-sasl-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kafka-sasl/opsera-service
        property: username
    - secretKey: password
      remoteRef:
        key: kafka-sasl/opsera-service
        property: password

---
# ExternalSecret: PII encryption keys (audit-service)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pii-encryption-keys
  namespace: opsera-internal
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pii-encryption-keys
    creationPolicy: Owner
  data:
    - secretKey: current_key
      remoteRef:
        key: pii-encryption-keys/current
        property: key
    - secretKey: current_version
      remoteRef:
        key: pii-encryption-keys/current
        property: version

---
# Allow DNS egress from all zones to kube-system (CoreDNS).
# Without this, pods cannot resolve service names.
# Applied to all four trust-zone namespaces.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: opsera-public
  labels:
    opsera.io/policy-type: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system


---
# Internal zone ingress: allow from DMZ (Kong/BFF) only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-allow-dmz-ingress
  namespace: opsera-internal
  labels:
    opsera.io/policy-type: zone-allow
    opsera.io/zone: internal
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              opsera.io/zone: dmz
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
        - port: 3003
          protocol: TCP
        - port: 3004
          protocol: TCP
        - port: 3005
          protocol: TCP
        - port: 3006
          protocol: TCP
        - port: 3007
          protocol: TCP
        - port: 3008
          protocol: TCP

---
# Internal zone ingress: allow inter-service communication within opsera-internal
# Services call each other on NestJS ports
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-allow-intra-zone
  namespace: opsera-internal
  labels:
    opsera.io/policy-type: zone-allow
    opsera.io/zone: internal
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              opsera.io/zone: internal

---
# Internal zone egress: allow to opsera-data on data store ports
# PostgreSQL: 5432, Redis: 6379, Kafka: 9092/9093, Elasticsearch: 9200/9300
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-allow-data-egress
  namespace: opsera-internal
  labels:
    opsera.io/policy-type: zone-allow
    opsera.io/zone: internal
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              opsera.io/zone: data
      ports:
        - port: 5432    # PostgreSQL
          protocol: TCP
        - port: 6379    # Redis
          protocol: TCP
        - port: 9092    # Kafka plaintext
          protocol: TCP
        - port: 9093    # Kafka TLS
          protocol: TCP
        - port: 9200    # Elasticsearch HTTP
          protocol: TCP
        - port: 9300    # Elasticsearch transport
          protocol: TCP
        - port: 9000    # MinIO S3 API
          protocol: TCP

---
# Internal → intra-zone (internal services calling each other)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-allow-intra-zone-egress
  namespace: opsera-internal
  labels:
    opsera.io/policy-type: zone-allow
    opsera.io/zone: internal
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              opsera.io/zone: internal

---
# Internal → Linkerd control plane
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-allow-linkerd
  namespace: opsera-internal
  labels:
    opsera.io/policy-type: linkerd-allow
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - port: 8080
          protocol: TCP
        - port: 8086
          protocol: TCP
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP

---
# Directional enforcement example: Risk Engine → Policy Engine (allowed)
# Risk Engine initiates policy evaluation requests to Policy Engine.
# Reverse direction (Policy Engine → Risk Engine) is NOT permitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-risk-to-policy-ingress
  namespace: opsera-internal
  labels:
    opsera.io/policy-type: directional-allow
    opsera.io/source: risk-engine
    opsera.io/target: policy-engine
spec:
  podSelector:
    matchLabels:
      app: policy-engine
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: risk-engine
      ports:
        - port: 3002
          protocol: TCP

# Opsera Forge Pipeline — Full multi-stage CI/CD with security scanning and Cosign signing
# Implements: WO-011 (foundation), WO-012 (security scanning), WO-015 (Cosign)

name: opsera-voyage
version: "2.0"

triggers:
  - type: webhook
    events: [push, pull_request]
    branches: [main, release/*, hotfix/*]

variables:
  GIT_SHA: "{{ git.sha }}"
  GIT_BRANCH: "{{ git.branch }}"
  SEMANTIC_VERSION: "{{ version.semver }}"
  PIPELINE_CORRELATION_ID: "{{ pipeline.id }}"
  REGISTRY_URL: "{{ env.REGISTRY_URL }}"

stages:
  # ── Stage 1: Parallel Build ──────────────────────────────────────────────────
  - name: Build
    parallel: true
    steps:
      - id: build:node
        name: Build TypeScript & Run Tests
        script: opsera-infra/forge/scripts/build-node.sh
        environment:
          NODE_ENV: test
        artifacts:
          - path: opsera-backend/coverage/**
            retention: 30d

      - id: build:docker
        name: Build Container Images
        script: opsera-infra/forge/scripts/build-docker.sh
        environment:
          REGISTRY_URL: "{{ env.REGISTRY_URL }}"
          GIT_SHA: "{{ git.sha }}"
          SEMANTIC_VERSION: "{{ version.semver }}"
        artifacts:
          - path: /tmp/image-digests.json
            retention: 90d

  # ── Stage 2: Parallel Security Scanning ─────────────────────────────────────
  - name: SecurityScan
    depends_on: [Build]
    parallel: true
    steps:
      - id: scan:gitleaks
        name: Secret Detection (Gitleaks)
        image: zricethezav/gitleaks:v8.18.0
        script: |
          gitleaks detect \
            --source /workspace \
            --config /workspace/opsera-infra/forge/config/.gitleaks.toml \
            --report-format json \
            --report-path /scan-results/gitleaks-results.json \
            --no-git
        artifacts:
          - path: /scan-results/gitleaks-results.json
            retention: 2555d  # 7 years compliance retention

      - id: scan:grype
        name: Container Image CVE Scan (Grype)
        image: anchore/grype:latest
        script: |
          SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                    "verification-service" "analytics-service" "auth-service" "bff-service")
          for SVC in "${SERVICES[@]}"; do
            grype "${REGISTRY_URL}/opsera/${SVC}:${GIT_SHA}" \
              --output sarif \
              --file "/scan-results/grype-${SVC}.sarif" \
              --fail-on critical
          done
        artifacts:
          - path: /scan-results/grype-*.sarif
            retention: 2555d

      - id: scan:sonarqube
        name: Static Analysis (SonarQube)
        image: sonarsource/sonar-scanner-cli:latest
        environment:
          SONAR_TOKEN: "{{ vault.secret.sonarqube.token }}"
          SONAR_HOST_URL: "{{ env.SONAR_HOST_URL }}"
        script: |
          sonar-scanner \
            -Dsonar.projectKey=opsera-voyage \
            -Dsonar.sources=opsera-backend/packages,opsera-frontend/src \
            -Dsonar.qualitygate.wait=true
        artifacts:
          - path: .scannerwork/
            retention: 2555d

      - id: scan:snyk
        name: Dependency Vulnerability Scan (Snyk)
        image: snyk/snyk:node
        environment:
          SNYK_TOKEN: "{{ vault.secret.snyk.token }}"
        script: |
          snyk test \
            --all-projects \
            --severity-threshold=high \
            --json-file-output=/scan-results/snyk-results.json
        artifacts:
          - path: /scan-results/snyk-results.json
            retention: 2555d

    on_failure:
      notify:
        - type: slack
          channel: "#security-alerts"
          message: |
            🚨 *Security scan FAILED* for {{ git.branch }} ({{ pipeline.id }})
            Scanner: {{ failed_step.id }}
            Commit: {{ git.sha }}

  # ── Stage 3: Push to Registry + Sign ────────────────────────────────────────
  - name: Push
    depends_on: [SecurityScan]
    condition: "{{ git.branch == 'main' || git.branch matches /^release\\// }}"
    steps:
      - id: push:registry
        name: Push Images to Registry
        script: |
          SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                    "verification-service" "analytics-service" "auth-service" "bff-service" "frontend")
          for SVC in "${SERVICES[@]}"; do
            docker push "${REGISTRY_URL}/opsera/${SVC}:${GIT_SHA}"
            docker push "${REGISTRY_URL}/opsera/${SVC}:${SEMANTIC_VERSION}"
          done

      - id: push:sign
        name: Cosign Image Signing
        depends_on: [push:registry]
        environment:
          VAULT_ADDR: "{{ env.VAULT_ADDR }}"
          VAULT_TOKEN: "{{ vault.token }}"
        script: opsera-infra/forge/scripts/cosign-sign.sh

  # ── Stage 4: Manual Approval Gate ──────────────────────────────────────────
  # WO-013: Approval gate with audit recording before any deployment
  - name: ApprovalGate
    depends_on: [Push]
    approval:
      required: true
      roles: [ReleaseManager, Admin]
      timeout: 8h
      presentation:
        show_scan_summary: true
        show_artifacts: true
        show_changelog: true
    steps:
      - id: gate:record-audit
        name: Record Approval Decision in Audit Trail
        environment:
          AUDIT_SERVICE_URL: "{{ env.AUDIT_SERVICE_URL }}"
          APPROVER_ID: "{{ approval.approver.id }}"
          APPROVER_EMAIL: "{{ approval.approver.email }}"
          APPROVAL_DECISION: "{{ approval.decision }}"
          PIPELINE_CORRELATION_ID: "{{ pipeline.id }}"
        script: opsera-infra/forge/scripts/record-approval-audit.sh
        on_reject:
          notify:
            - type: slack
              channel: "#platform-deployments"
              message: |
                ⛔ *Deployment REJECTED* by {{ approval.approver.email }}
                Branch: {{ git.branch }} | Commit: {{ git.sha | truncate(8) }}
                Pipeline: {{ pipeline.id }}

  # ── Stage 5: Deploy to Dev ───────────────────────────────────────────────────
  - name: DeployDev
    depends_on: [ApprovalGate]
    steps:
      - id: deploy:dev
        name: Helm Deploy to Dev Cluster
        environment:
          KUBECONFIG: "{{ vault.secret.kubeconfig.dev }}"
        script: |
          set -euo pipefail
          SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                    "verification-service" "analytics-service" "auth-service" "bff-service" "frontend")
          for SVC in "${SERVICES[@]}"; do
            helm upgrade --install "opsera-${SVC}" "opsera-infra/helm/charts/base-nestjs" \
              --namespace opsera-internal \
              --values "opsera-infra/helm/environments/dev/values.yaml" \
              --set "global.image.tag=${GIT_SHA}" \
              --set "global.serviceName=${SVC}" \
              --wait --timeout 5m
          done

      - id: test:smoke-dev
        name: Smoke Tests (Dev)
        depends_on: [deploy:dev]
        environment:
          BASE_URL: "{{ env.DEV_BASE_URL }}"
        script: |
          chmod +x opsera-infra/tests/smoke/smoke-test.sh
          BASE_URL="${BASE_URL}" RETRIES=8 RETRY_DELAY=15 \
            opsera-infra/tests/smoke/smoke-test.sh

      - id: test:contract-dev
        name: API Contract Tests (Dev)
        depends_on: [test:smoke-dev]
        environment:
          BASE_URL: "{{ env.DEV_BASE_URL }}"
        script: |
          chmod +x opsera-infra/tests/contract/validate-contracts.sh
          BASE_URL="${BASE_URL}" opsera-infra/tests/contract/validate-contracts.sh

    on_failure:
      steps:
        - id: rollback:dev
          name: Rollback Dev
          script: |
            SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                      "verification-service" "analytics-service" "auth-service" "bff-service")
            for SVC in "${SERVICES[@]}"; do
              helm rollback "opsera-${SVC}" 0 -n opsera-internal || true
            done
      notify:
        - type: slack
          channel: "#platform-deployments"
          message: |
            🚨 *Dev deployment FAILED* | {{ pipeline.id }}
            Step: {{ failed_step.id }}
            Branch: {{ git.branch }} | Commit: {{ git.sha | truncate(8) }}

  # ── Stage 6: Staging Canary Deploy ──────────────────────────────────────────
  - name: DeployStaging
    depends_on: [DeployDev]
    steps:
      - id: deploy:staging-canary
        name: Canary Deploy to Staging (10% traffic, 15 min)
        environment:
          KUBECONFIG: "{{ vault.secret.kubeconfig.staging }}"
        script: |
          set -euo pipefail
          SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                    "verification-service" "analytics-service" "auth-service" "bff-service" "frontend")
          for SVC in "${SERVICES[@]}"; do
            # Deploy canary with 10% weight via Linkerd TrafficSplit
            helm upgrade --install "opsera-${SVC}-canary" "opsera-infra/helm/charts/base-nestjs" \
              --namespace opsera-staging \
              --values "opsera-infra/helm/environments/staging/values.yaml" \
              --set "global.image.tag=${GIT_SHA}" \
              --set "global.serviceName=${SVC}" \
              --set "canary.enabled=true" \
              --set "canary.weight=10" \
              --wait --timeout 5m
          done

      - id: test:canary-wait
        name: Canary Soak Period (15 minutes)
        depends_on: [deploy:staging-canary]
        script: |
          echo "Waiting 15 minutes for canary metrics to stabilize..."
          sleep 900

      - id: test:load-staging
        name: k6 Load Test (200 VUs, p95 < 500ms)
        depends_on: [test:canary-wait]
        image: grafana/k6:latest
        environment:
          BASE_URL: "{{ env.STAGING_BASE_URL }}"
          AUTH_TOKEN: "{{ vault.secret.staging.load_test_token }}"
        script: |
          k6 run \
            --env BASE_URL="${BASE_URL}" \
            --env AUTH_TOKEN="${AUTH_TOKEN}" \
            opsera-infra/tests/load/k6-staging.js

      - id: deploy:staging-full
        name: Promote Canary to Full Staging Deployment
        depends_on: [test:load-staging]
        environment:
          KUBECONFIG: "{{ vault.secret.kubeconfig.staging }}"
        script: |
          set -euo pipefail
          SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                    "verification-service" "analytics-service" "auth-service" "bff-service" "frontend")
          for SVC in "${SERVICES[@]}"; do
            helm upgrade --install "opsera-${SVC}" "opsera-infra/helm/charts/base-nestjs" \
              --namespace opsera-staging \
              --values "opsera-infra/helm/environments/staging/values.yaml" \
              --set "global.image.tag=${GIT_SHA}" \
              --set "global.serviceName=${SVC}" \
              --set "canary.enabled=false" \
              --wait --timeout 10m
            # Delete canary release
            helm delete "opsera-${SVC}-canary" -n opsera-staging || true
          done

    on_failure:
      steps:
        - id: rollback:staging
          name: Rollback Staging Canary
          script: |
            SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                      "verification-service" "analytics-service" "auth-service" "bff-service")
            for SVC in "${SERVICES[@]}"; do
              helm delete "opsera-${SVC}-canary" -n opsera-staging || true
            done
      notify:
        - type: slack
          channel: "#platform-incidents"
          message: |
            🚨 *Staging deployment FAILED* | {{ pipeline.id }}
            Step: {{ failed_step.id }} | Branch: {{ git.branch }}

  # ── Stage 7: Production Approval + Rolling Deploy ────────────────────────────
  - name: DeployProduction
    depends_on: [DeployStaging]
    approval:
      required: true
      roles: [ReleaseManager, Admin]
      min_approvals: 2
      timeout: 4h
      presentation:
        show_staging_metrics: true
        show_scan_summary: true
    steps:
      - id: gate:prod-audit
        name: Record Production Approval in Audit Trail
        environment:
          AUDIT_SERVICE_URL: "{{ env.AUDIT_SERVICE_URL }}"
          APPROVER_ID: "{{ approval.approver.id }}"
          APPROVAL_DECISION: "{{ approval.decision }}"
          PIPELINE_CORRELATION_ID: "{{ pipeline.id }}"
          ENVIRONMENT: production
        script: opsera-infra/forge/scripts/record-approval-audit.sh

      - id: deploy:production
        name: Rolling Deploy to Production (maxSurge 25%, maxUnavailable 0)
        depends_on: [gate:prod-audit]
        environment:
          KUBECONFIG: "{{ vault.secret.kubeconfig.production }}"
        script: |
          set -euo pipefail
          SERVICES=("release-service" "risk-engine" "policy-engine" "audit-service"
                    "verification-service" "analytics-service" "auth-service" "bff-service" "frontend")
          for SVC in "${SERVICES[@]}"; do
            helm upgrade --install "opsera-${SVC}" "opsera-infra/helm/charts/base-nestjs" \
              --namespace opsera-production \
              --values "opsera-infra/helm/environments/production/values.yaml" \
              --set "global.image.tag=${GIT_SHA}" \
              --set "global.serviceName=${SVC}" \
              --set "deployment.strategy.type=RollingUpdate" \
              --set "deployment.strategy.rollingUpdate.maxSurge=25%" \
              --set "deployment.strategy.rollingUpdate.maxUnavailable=0" \
              --wait --timeout 15m \
              --atomic  # auto-rollback on failure
          done

      - id: test:smoke-production
        name: Smoke Tests (Production)
        depends_on: [deploy:production]
        environment:
          BASE_URL: "{{ env.PRODUCTION_BASE_URL }}"
        script: |
          chmod +x opsera-infra/tests/smoke/smoke-test.sh
          BASE_URL="${BASE_URL}" RETRIES=10 RETRY_DELAY=15 \
            opsera-infra/tests/smoke/smoke-test.sh

    on_failure:
      notify:
        - type: slack
          channel: "#platform-incidents"
          message: |
            🔥 *PRODUCTION deployment FAILED* | {{ pipeline.id }}
            Step: {{ failed_step.id }} | SHA: {{ git.sha }}
            Helm `--atomic` flag triggered automatic rollback.
            @here Immediate investigation required.
        - type: pagerduty
          severity: critical
          message: "Production deployment failed — {{ pipeline.id }}"
